// ====== HOME PAGE ======
function renderHomePage() {
  document.getElementById('cardList').style.display = 'none';
  document.querySelector('.search-bar').style.display = 'none';
  document.getElementById('statsRow').style.display = 'none';
  document.getElementById('filterScroll').style.display = 'none';
  document.getElementById('batchBar').style.display = 'none';
  var all = orderPackages;

  var now = new Date();
  var weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  var dateStr = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+weekDays[now.getDay()];

  var h = '';
  // 订单流转看板
  var jbCnt = all.filter(function(o){return ['待认领','待分配','待打包','打包中','打包完成','打包完毕','审核'].indexOf(o.status)>=0;}).length;
  var pickCnt = all.filter(function(o){return ['待认领','拣货中','拣货完成'].indexOf(o.status)>=0;}).length;
  var packCnt = all.filter(function(o){return ['待分配','待打包','打包中'].indexOf(o.status)>=0;}).length;
  var qcCnt = all.filter(function(o){return ['待质检','质检中'].indexOf(o.status)>=0;}).length;
  var pendingPay = all.filter(function(o){return o.status==='打包完毕'&&!o.verifyPaidAt;}).length;
  var pendingShip = all.filter(function(o){return o.verifyPaidAt&&!o.verifyShipAt;}).length;
  var shipping = all.filter(function(o){return o.verifyShipAt&&!o.verifyDoneAt;}).length;
  var verifyDone = all.filter(function(o){return o.verifyDoneAt;}).length;
  var exCnt = all.filter(function(o){return o.status==='异常';}).length;
  var retCnt = (orderReturns||[]).length;

  var pipeline = [
    { num:jbCnt, label:'集包', color:'#166534', bg:'#FFFFFF', ico:'pkg' },
    { num:pickCnt, label:'拣货', color:'#166534', bg:'#FFFFFF', ico:'pick' },
    { num:packCnt, label:'打包', color:'#166534', bg:'#FFFFFF', ico:'pack' },
    { num:pendingPay, label:'待付款', color:'#D97706', bg:'#FFFFFF', ico:'dollar' },
    { num:pendingShip, label:'待发货', color:'#166534', bg:'#FFFFFF', ico:'truck' },
    { num:shipping, label:'发货中', color:'#166534', bg:'#FFFFFF', ico:'spinner' },
    { num:verifyDone, label:'已完成', color:'#15803D', bg:'#FFFFFF', ico:'check' }
  ];

  // Hero区
  h += '<div class="dash-hero"><h2>'+uiIco('sun','#FFFFFF',18)+'早上好，张三</h2><div class="date">'+uiIco('calendar','rgba(255,255,255,0.85)',13)+dateStr+'</div></div>';

  // 订单流转看板（白色卡片底）
  h += '<div class="dash-section" style="padding-bottom:6px;"><h3>'+uiIco('route','var(--primary)',14)+'订单流转看板</h3></div>';
  h += '<div style="background:#FFF7ED;border-radius:12px;padding:14px 10px;margin:0 12px;box-shadow:var(--shadow);">';
  // Row 1: 集包 → 拣货 → 打包 → 待付款
  h += '<div class="pipeline-row">';
  for (var pi=0; pi<4; pi++) {
    var pn = pipeline[pi];
    h += '<div class="pipeline-step"><div class="pipeline-node" style="background:'+pn.bg+';"><span class="pn-ico" style="color:'+pn.color+';">'+statIco(pn.ico, pn.color)+'</span><div class="pn-num" style="color:'+pn.color+';">'+pn.num+'</div><div class="pn-lbl">'+pn.label+'</div></div></div>';
    if (pi<3) h += '<div class="pipeline-arrow">→</div>';
  }
  h += '</div>';
  // Row 2: 待发货 → 发货中 → 已完成
  h += '<div class="pipeline-row">';
  for (var pi=4; pi<pipeline.length; pi++) {
    var pn = pipeline[pi];
    h += '<div class="pipeline-step"><div class="pipeline-node" style="background:'+pn.bg+';"><span class="pn-ico" style="color:'+pn.color+';">'+statIco(pn.ico, pn.color)+'</span><div class="pn-num" style="color:'+pn.color+';">'+pn.num+'</div><div class="pn-lbl">'+pn.label+'</div></div></div>';
    if (pi<pipeline.length-1) h += '<div class="pipeline-arrow">→</div>';
  }
  h += '</div>';
  h += '</div>';

  // KPI概览（左右结构，压缩高度）
  h += '<div class="dash-summary">';
  h += '<div class="dash-kpi"><div class="kpi-ico" style="background:#ECFDF5;">'+statIco('pkg','#166534')+'</div><div class="kpi-info"><div class="kpi-val" style="color:#166534;">'+jbCnt+'</div><div class="kpi-lbl">集包订单</div></div></div>';
  h += '<div class="dash-kpi"><div class="kpi-ico" style="background:#FFF7ED;">'+statIco('clock','#EA580C')+'</div><div class="kpi-info"><div class="kpi-val" style="color:#EA580C;">'+(pickCnt+packCnt)+'</div><div class="kpi-lbl">待处理</div></div></div>';
  h += '<div class="dash-kpi"><div class="kpi-ico" style="background:#F0FDF4;">'+statIco('check','#16A34A')+'</div><div class="kpi-info"><div class="kpi-val" style="color:#16A34A;">'+verifyDone+'</div><div class="kpi-lbl">已完成</div></div></div>';
  h += '<div class="dash-kpi"><div class="kpi-ico" style="background:#FEF2F2;">'+statIco('ex','#DC2626')+'</div><div class="kpi-info"><div class="kpi-val" style="color:#DC2626;">'+exCnt+'</div><div class="kpi-lbl">异常订单</div></div></div>';
  h += '</div>';

  // 趋势图Tab
  var chartTabs = ['pick','pack','verify','exception','return'];
  var chartTabNames = {pick:'拣货',pack:'打包',verify:'核款',exception:'异常',return:'退件'};
  var chartColors = {
    pick: ['#F59E0B','#7C3AED','#16A34A'],
    pack: ['#EA580C','#166534','#16A34A'],
    verify: ['#EA580C','#166534','#7C3AED','#16A34A'],
    exception: ['#F59E0B','#DC2626'],
    return: ['#7C3AED','#166534','#16A34A']
  };
  var chartLabels = {
    pick: ['待认领','拣货中','拣货完成'],
    pack: ['待打包','打包中','打包完成'],
    verify: ['待付款','待发货','发货中','已完成'],
    exception: ['拣货异常','打包异常'],
    return: ['待处理','处理中','已完成']
  };

  // 生成7天模拟数据
  function genDayData(module,dayOffset) {
    var r = function(m){return Math.floor(Math.random()*m);};
    if (module==='pick') return [r(6)+3, r(5)+2, r(8)+5];
    if (module==='pack') return [r(6)+4, r(5)+3, r(7)+6];
    if (module==='verify') return [r(4)+2, r(4)+2, r(3)+2, r(5)+6];
    if (module==='exception') return [r(3)+1, r(3)+1];
    return [r(3)+2, r(2)+2, r(3)+3];
  }
  var dayLabels = [];
  for (var d=6; d>=0; d--) dayLabels.push((now.getDate()-d)+'日');

  // 生成当前tab的7天数据
  var chartData = [];
  for (var d=0; d<7; d++) chartData.push(genDayData(homeChartTab,d));
  var maxCV = Math.max.apply(null,chartData.map(function(arr){return arr.reduce(function(a,b){return a+b;},0);}))||1;

  h += '<div class="dash-section"><h3>'+uiIco('trending','var(--primary)',14)+'近7天趋势</h3></div>';
  // Tab切换
  h += '<div class="dash-chart-tabs">';
  chartTabs.forEach(function(ct){
    h += '<div class="dash-chart-tab'+(homeChartTab===ct?' active':'')+'" onclick="switchHomeChart(\''+ct+'\')">'+chartTabNames[ct]+'</div>';
  });
  h += '</div>';

  // 图例
  h += '<div class="chart-legend">';
  chartLabels[homeChartTab].forEach(function(l,li){
    h += '<span><span class="legend-dot" style="background:'+chartColors[homeChartTab][li]+';"></span>'+l+'</span>';
  });
  h += '</div>';

  // 折线图
  var lbls = chartLabels[homeChartTab];
  var clrs = chartColors[homeChartTab];
  // 转置：按状态分组 → 7天数据
  var series = [];
  for (var si=0; si<lbls.length; si++) series.push([]);
  for (var d=0; d<7; d++) for (var si=0; si<lbls.length; si++) series[si].push(chartData[d][si]);
  var allVals = []; series.forEach(function(s){allVals=allVals.concat(s);});
  var maxV = Math.max.apply(null,allVals)||1;
  var svgW = 320, svgH = 180, padL = 30, padR = 16, padT = 12, padB = 24;
  var plotW = svgW-padL-padR, plotH = svgH-padT-padB;
  var stepX = plotW/6;

  h += '<div class="dash-chart" style="margin-top:4px;padding:12px 8px 8px;">';
  h += '<svg viewBox="0 0 '+svgW+' '+svgH+'" style="width:100%;display:block;">';

  // Y轴网格线 + 刻度
  var yTicks = 4;
  for (var yi=0; yi<=yTicks; yi++) {
    var yv = Math.round(maxV*yi/yTicks);
    var yy = padT + plotH - (plotH*yi/yTicks);
    h += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(svgW-padR)+'" y2="'+yy+'" stroke="#F3F4F6" stroke-width="1"/>';
    h += '<text x="'+(padL-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="9" fill="#9CA3AF">'+yv+'</text>';
  }

  // 折线
  for (var si=0; si<series.length; si++) {
    var s = series[si];
    var pts = '';
    for (var d=0; d<7; d++) {
      var x = padL + d*stepX;
      var y = padT + plotH - (s[d]/maxV*plotH);
      pts += (pts?',':'')+x+','+y;
    }
    h += '<polyline points="'+pts+'" fill="none" stroke="'+clrs[si]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    // 数据点
    for (var d=0; d<7; d++) {
      var x = padL + d*stepX;
      var y = padT + plotH - (s[d]/maxV*plotH);
      h += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="#fff" stroke="'+clrs[si]+'" stroke-width="2"/>';
      // 最后一天标注数值
      if (d===6) h += '<text x="'+(x+6)+'" y="'+(y-4)+'" font-size="9" fill="'+clrs[si]+'" font-weight="600">'+s[d]+'</text>';
    }
  }

  // X轴标签
  for (var d=0; d<7; d++) {
    h += '<text x="'+(padL+d*stepX)+'" y="'+(svgH-6)+'" text-anchor="middle" font-size="9" fill="#9CA3AF">'+dayLabels[d]+'</text>';
  }

  h += '</svg></div>';

  // 最近动态
  h += '<div class="dash-section"><h3>'+uiIco('clock','var(--primary)',14)+'最近动态</h3></div>';
  h += '<div class="dash-recent">';
  var recentItems = [
    {dot:'#16A34A',text:'打包完成：JB-20260709-0012',time:'10分钟前'},
    {dot:'#EA580C',text:'待分配订单：XY20260709001',time:'25分钟前'},
    {dot:'#DC2626',text:'异常上报：JB-20260709-EX02',time:'1小时前'},
    {dot:'#16A34A',text:'核款完成：XY20260708001',time:'2小时前'},
    {dot:'#166534',text:'付款确认：XY20260708002',time:'3小时前'}
  ];
  recentItems.forEach(function(r){
    h += '<div class="recent-item"><div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;"><div class="recent-dot" style="background:'+r.dot+';"></div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+r.text+'</span></div><span style="font-size:11px;color:var(--text-secondary);flex-shrink:0;">'+r.time+'</span></div>';
  });
  h += '</div>';

  document.getElementById('cardList').innerHTML = '<div>'+h+'</div>';
  document.getElementById('cardList').style.display = 'block';
  document.getElementById('cardList').style.padding = '0';
  document.getElementById('batchBar').innerHTML = '';
  document.getElementById('filterScroll').innerHTML = '';
  document.getElementById('statsRow').innerHTML = '';
  updateBadges();
}
